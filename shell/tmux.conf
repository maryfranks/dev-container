# =====================================================================
# SHARED DEFAULT TMUX CONFIGURATION
# =====================================================================

# Truecolor terminal support
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# Prefix key: Ctrl+Space
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Usability defaults
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000

# Repeatable pane resizing bindings (prefix + Shift + H/J/K/L)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Restrained status bar styling with active prefix indicator
set -g status-style bg=default,fg=colour14
set -g status-right '#{?client_prefix,#[bg=colour66 fg=colour231 bold] PREFIX #[default],} %H:%M %d-%b-%Y'
